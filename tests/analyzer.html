<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Analyzer tests</title>
  <style>
    body { font: 14px/1.5 ui-monospace, Consolas, monospace; margin: 24px; }
    .pass { color: #1b7f3a; } .fail { color: #c0331b; font-weight: bold; }
  </style>
</head>
<body>
  <h1 id="summary">Running…</h1>
  <pre id="out"></pre>

  <script src="../js/skeleton.js"></script>
  <script src="../js/analyzer.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/drills.js"></script>
  <script>
    I18n.set("en");
    // Fake MediaPipe output from the stick figure. Facing +x, the right side is toward the
    // camera; mirrored, it's a left-hander showing their left side.
    const W = 480;
    function landmarks(j, { mirror = false, feetVisible = true } = {}) {
      const S = Skeleton.S;
      const X = x => (mirror ? W - x : x);
      const pt = (p, v) => ({ x: X(p[0]), y: p[1], v });
      const lm = Array.from({ length: 33 }, () => ({ x: 0, y: 0, v: 0 }));
      const [N, F] = mirror ? [0, 1] : [1, 0];
      const pair = (idx, near, far) => { lm[idx[N]] = pt(near, 0.95); lm[idx[F]] = pt(far, 0.6); };
      lm[0] = pt([j.head[0] + 7 * S, j.head[1] + 2 * S], 0.95);
      lm[7] = pt([j.head[0] - 3 * S, j.head[1]], 0.9);
      lm[8] = pt([j.head[0] - 3 * S, j.head[1]], 0.9);
      pair([11, 12], j.sh, [j.sh[0] - 1, j.sh[1]]);
      pair([13, 14], j.elbowN, j.elbowF);
      pair([15, 16], j.wristN, j.wristF);
      pair([23, 24], j.hip, [j.hip[0] - 1, j.hip[1]]);
      pair([25, 26], j.kneeN, j.kneeF);
      pair([27, 28], j.ankleN, j.ankleF);
      if (!feetVisible) lm[27].v = lm[28].v = 0.05;
      return lm;
    }
    function frames(steps, opts = {}) {
      const tl = Skeleton.timeline(steps);
      const fps = opts.fps || 15;
      const out = [];
      for (let ms = 0; ms <= tl.total; ms += 1000 / fps) {
        const j = Skeleton.solve(Skeleton.poseAt(tl, ms));
        out.push({ t: ms / 1000, lm: opts.nobody ? null : landmarks(j, opts) });
      }
      return out;
    }

    const P = Skeleton.POSES;
    const GOOD_SPIKE = [
      ["stand", 70, 0, 300], ["step1", 115, 300, 0], ["step2", 170, 250, 0], ["plant", 215, 220, 40],
      ["takeoff", 238, 150, 0], ["cock", 255, 200, 0], ["hit", 265, 130, 0], ["follow", 285, 200, 0],
      ["land", 300, 220, 0], ["stand", 305, 400, 300],
    ];
    // Beginner "push": no windup, elbow in front, hand tops out low.
    const pushWind = Object.assign({}, P.cock, { torso: 175, uaN: 100, faN: 140 });
    const pushTop = Object.assign({}, P.hit, { uaN: 135, faN: 120 });
    const takeoffLow = Object.assign({}, P.takeoff, { uaN: 100, faN: 120 });
    const PUSH_SPIKE = GOOD_SPIKE.map(s =>
      s[0] === "takeoff" ? [takeoffLow, ...s.slice(1)]
      : s[0] === "cock" ? [pushWind, ...s.slice(1)]
      : s[0] === "hit" ? [pushTop, ...s.slice(1)] : s);
    // Late swing: peak during the windup, contact well after it.
    const LATE_SPIKE = GOOD_SPIKE.map(s =>
      s[0] === "cock" ? [Object.assign({}, P.cock, { lift: 130 }), s[1], 200, 0]
      : s[0] === "hit" ? [Object.assign({}, P.hit, { lift: 100 }), s[1], 340, 0] : s);
    const ARM_SWING = [
      ["stand", 220, 0, 400], ["armsUp", 220, 450, 100], ["cockStand", 220, 380, 100],
      ["hitStand", 222, 170, 0], ["followStand", 224, 260, 100], ["stand", 220, 500, 300],
    ];
    const IDLE = [["stand", 220, 0, 1500], ["stand", 220, 500, 500]];
    // Arm swing with the other arm kept down (to test the hand setting).
    const offDown = pose => Object.assign({}, P[pose], { uaF: P.stand.uaF, faF: P.stand.faF });
    const ONE_ARM_SWING = ARM_SWING.map(s => [offDown(s[0]), ...s.slice(1)]);

    const lines = [];
    let failed = 0;
    const check = (name, cond, detail = "") => {
      if (!cond) failed++;
      lines.push(`<span class="${cond ? "pass" : "fail"}">${cond ? "PASS" : "FAIL"}</span> ${name}${detail ? "  — " + detail : ""}`);
    };
    const run = (fr, opts) => Analyzer.analyze(fr, Object.assign({ hand: "right", heightCm: 175 }, opts));
    const drill = id => Drills.byId(id);

    // 1. A good full spike passes everything.
    let r = run(frames(GOOD_SPIKE));
    check("good spike: analyzed", r.ok, JSON.stringify(r.gate || ""));
    if (r.ok) {
      check("good spike: jumped 25–55 cm", r.jumped && r.metrics.jumpCm >= 25 && r.metrics.jumpCm <= 55, `jump ${r.metrics.jumpCm} cm`);
      check("good spike: reach passes", r.checks.reach.pass, `miss ${r.metrics.reachMissCm} cm, elbow ${r.metrics.elbowAngle}°`);
      check("good spike: elbow back", r.checks.elbowBack.pass);
      check("good spike: arms back", r.checks.armsBack.pass);
      check("good spike: timing", r.checks.timing.pass, `${r.metrics.timingMs} ms`);
      check("good spike: travel", r.checks.travel.pass, `${r.metrics.travelCm} cm`);
      check("good spike: facing right", r.dir === 1);
      const ev = Drills.evaluate(r, drill("full-spike"));
      check("good spike: full-spike drill perfect", ev.perfect && ev.focusPass, JSON.stringify(ev));
    }

    // 2. The same spike, mirrored, by a left-hander.
    r = run(frames(GOOD_SPIKE, { mirror: true }), { hand: "left" });
    check("mirrored lefty: analyzed", r.ok, JSON.stringify(r.gate || ""));
    if (r.ok) {
      check("mirrored lefty: facing left", r.dir === -1);
      check("mirrored lefty: all checks pass",
        ["reach", "elbowBack", "armsBack", "timing", "travel", "jump"].every(k => r.checks[k].pass),
        JSON.stringify(r.checks));
    }

    // 3. Pushing the ball: low reach and no windup.
    r = run(frames(PUSH_SPIKE));
    check("push spike: analyzed", r.ok, JSON.stringify(r.gate || ""));
    if (r.ok) {
      check("push spike: reach fails by 12+ cm", !r.checks.reach.pass && r.metrics.reachMissCm >= 12, `miss ${r.metrics.reachMissCm} cm`);
      check("push spike: elbow back fails", !r.checks.elbowBack.pass);
      const ev = Drills.evaluate(r, drill("arm-swing"));
      check("push spike: arm-swing fix is elbowBack", ev.fix === "elbowBack", ev.fix);
      const fb = Drills.feedback(r, drill("jump-reach"), Drills.evaluate(r, drill("jump-reach")));
      check("push spike: jump-reach fix is reach", fb.title === "Reach higher", fb.title + " / " + fb.text);
    }

    // 4. Late contact.
    r = run(frames(LATE_SPIKE));
    check("late spike: analyzed", r.ok, JSON.stringify(r.gate || ""));
    if (r.ok) check("late spike: timing late", r.checks.timing.late, `${r.metrics.timingMs} ms`);

    // 5. Standing arm swing, no jump.
    r = run(frames(ARM_SWING));
    check("arm swing: analyzed", r.ok, JSON.stringify(r.gate || ""));
    if (r.ok) {
      check("arm swing: no jump", !r.jumped, `jump ${r.metrics.jumpCm} cm`);
      check("arm swing: reach passes", r.checks.reach.pass, `miss ${r.metrics.reachMissCm} cm`);
      check("arm swing: elbow back", r.checks.elbowBack.pass);
      check("arm swing: other arm points up", r.checks.offArmUp.pass && !r.checks.offArmUp.unknown);
      check("arm swing: arm-swing drill done", Drills.evaluate(r, drill("arm-swing")).focusPass);
      check("arm swing: jump drill asks to jump", Drills.evaluate(r, drill("jump-reach")).fix === "jump");
    }

    // 6. Gates.
    check("nobody in frame → noPerson", run(frames(GOOD_SPIKE, { nobody: true })).gate === "noPerson");
    check("feet cut off → feetOut", run(frames(GOOD_SPIKE, { feetVisible: false })).gate === "feetOut");
    check("no swing → noSwing", run(frames(IDLE)).gate === "noSwing", JSON.stringify(run(frames(IDLE)).gate));
    check("wrong hand → wrongHand", run(frames(ONE_ARM_SWING), { hand: "left" }).gate === "wrongHand",
      JSON.stringify(run(frames(ONE_ARM_SWING), { hand: "left" }).gate));
    check("too few frames → tooShort", run(frames(GOOD_SPIKE).slice(0, 4)).gate === "tooShort");

    // 7. A camera cut to a wide shot (tiny, mis-tracked person) must not fake a jump.
    const shrink = lm => lm.map(p => ({ x: 400 + (p.x - 220) * 0.25, y: 60 + (p.y - 150) * 0.25, v: p.v }));
    const cut = frames(ARM_SWING).concat(frames(ARM_SWING).slice(0, 25).map(f => ({ t: f.t + 4, lm: shrink(f.lm) })));
    r = run(cut);
    check("camera cut: still analyzed as a standing swing", r.ok && !r.jumped && r.checks.reach.pass,
      r.ok ? `jump ${r.metrics.jumpCm} cm, miss ${r.metrics.reachMissCm} cm` : r.gate);

    // A one-frame tracking glitch mid-approach must not split the rep.
    const glitched = frames(GOOD_SPIKE);
    glitched[10] = { t: glitched[10].t, lm: glitched[10].lm.map(p => ({ x: p.x + 180, y: p.y - 60, v: p.v })) };
    r = run(glitched);
    check("one-frame glitch: full spike still passes", r.ok && ["reach", "elbowBack", "armsBack", "timing", "travel", "jump"].every(k => r.checks[k].pass),
      r.ok ? JSON.stringify(r.metrics) : r.gate);

    // 8. Lower frame rate (long clips are sampled at 8 fps).
    r = run(frames(GOOD_SPIKE, { fps: 8 }));
    check("8 fps good spike: reach + timing pass", r.ok && r.checks.reach.pass && r.checks.timing.pass,
      r.ok ? `miss ${r.metrics.reachMissCm} cm, timing ${r.metrics.timingMs} ms` : r.gate);

    // 9. Every fix has copy.
    for (const name of ["reach", "elbowBack", "offArmUp", "armsBack", "jump", "timing", "travel"]) {
      const fake = { checks: { reach: { missCm: 20, elbowAngle: 150 }, timing: { early: true } }, metrics: { travelCm: 80 } };
      const fb = Drills.feedback(fake, drill("full-spike"), { fix: name });
      check(`copy for ${name}`, fb.title && fb.text && fb.tip);
    }

    // 10. Romanian has every English line, and drills/fixes switch language.
    const missing = I18n.keys("en").filter(k => !I18n.keys("ro").includes(k));
    check("Romanian copy is complete", missing.length === 0, missing.join(", "));
    I18n.set("ro");
    const roFix = Drills.feedback({ checks: { reach: { missCm: 20 } } }, drill("full-spike"), { fix: "reach" });
    check("Romanian fix copy", roFix.title === "Întinde-te mai sus" && roFix.text.includes("20 cm"), roFix.text);
    check("Romanian drill title", drill("arm-swing").title === "Balansul brațului", drill("arm-swing").title);
    check("Romanian counts", I18n.t("share.streak", { n: 21 }) === "21 de zile la rând" && I18n.t("pop.done", { n: 3 }).startsWith("Exersat de 3 ori"),
      I18n.t("share.streak", { n: 21 }) + " / " + I18n.t("pop.done", { n: 3 }));
    I18n.set("en");

    document.getElementById("out").innerHTML = lines.join("\n");
    document.getElementById("summary").textContent = failed ? `FAILED ${failed}` : `ALL ${lines.length} PASSED`;
    document.title = failed ? `FAILED ${failed}` : "PASSED";
  </script>
</body>
</html>
